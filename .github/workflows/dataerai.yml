name: Dataerai provenance
on: [push, pull_request]
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest numpy matplotlib ipython nbclient
      - run: python -m pip install opencv-python==4.11.0.86 scipy tqdm h5py
      - run: python -m pytest tests -q
